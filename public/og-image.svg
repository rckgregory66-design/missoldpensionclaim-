<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0f2035"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold accent bar -->
  <rect x="80" y="80" width="6" height="80" fill="#c9a84c" rx="3"/>

  <!-- SRA badge -->
  <rect x="80" y="500" width="280" height="36" rx="18" fill="#c9a84c" fill-opacity="0.15" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="100" y="523" font-family="Georgia, serif" font-size="14" fill="#c9a84c" font-weight="600">SRA Regulated · No. 800525</text>

  <!-- Main headline -->
  <text x="100" y="160" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1">Mis-Sold Pension</text>
  <text x="100" y="230" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1">Claims Solicitors</text>

  <!-- Sub-headline -->
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="26" fill="#94a3b8">Free initial review · No win no fee options</text>

