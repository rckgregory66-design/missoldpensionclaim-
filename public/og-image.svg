  <text x="100" y="418" font-family="Arial, sans-serif" font-size="17" fill="#64748b">missoldpensionclaim.co.uk</text>

  <!-- Right side decorative element -->
  <circle cx="980" cy="315" r="220" fill="#c9a84c" fill-opacity="0.04"/>
  <circle cx="980" cy="315" r="170" fill="#c9a84c" fill-opacity="0.04"/>
  <circle cx="980" cy="315" r="120" fill="#c9a84c" fill-opacity="0.06"/>

  <!-- Scale icon (simplified) -->
  <g transform="translate(920, 250)" opacity="0.3">
    <rect x="58" y="0" width="4" height="130" fill="#c9a84c" rx="2"/>
    <rect x="0" y="0" width="120" height="4" fill="#c9a84c" rx="2"/>
    <circle cx="60" cy="2" r="6" fill="#c9a84c"/>
    <ellipse cx="20" cy="50" rx="24" ry="16" fill="none" stroke="#c9a84c" stroke-width="3"/>
    <line x1="20" y1="4" x2="20" y2="34" stroke="#c9a84c" stroke-width="3"/>
    <ellipse cx="100" cy="50" rx="24" ry="16" fill="none" stroke="#c9a84c" stroke-width="3"/>
    <line x1="100" y1="4" x2="100" y2="34" stroke="#c9a84c" stroke-width="3"/>
